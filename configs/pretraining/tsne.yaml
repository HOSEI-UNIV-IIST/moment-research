#Experiment parameters
random_seed: 13
notes: "tsne runs"

# Encoder (MOMENT) parameters
task_name: "tsne" 

# Model parameters
model_name: "MOMENT"
seq_len: 512
patch_len: 8
patch_stride_len: 8
revin_affine: False
d_model: null
dropout: 0.1
torch_dtype: "bfloat16"
value_embedding_bias: False # Whether to add biases to the value embeddings
orth_gain: 1.41
add_positional_embedding: False # Wheter to add positional embedding to the input
set_input_mask: True # Whether to set the input mask
transformer_type: "encoder_only" # "encoder_decoder" "encoder_only" "decoder_only"
transformer_backbone: 'google/flan-t5-base' # "PatchTST" "google/flan-t5-base" "t5-large"

freeze_transformer_backbone: False # Whether to freeze the transformer backbone
randomly_initialize_backbone: True # Whether to randomly initialize the encoder False to bring pre-trained moment
initialize_backbone_with_pretrained_moment : True # Whether to initialize with pre-trained momet
training_pretrained_moment_with_lora: True # Whether to train pre-trained moment with lora
tfc_contrastive_learning: False # Whether to pre-train using time-frequency consistent contrastive learning
pretraining_run_name: "result_etth1"
pretraining_opt_steps: 1000
dataset_names: '/home/jinseopalang/TSFM/moment-research/moment/data/TimeseriesDatasets/forecasting/autoformer/ETTh1.csv'

# Logging
log_interval: 2000 #100000
checkpoint_interval: 1000 #5000
debug: False

# Training parameters
mask_ratio: 0.3
optimizer_name : "AdamW"
enable_gradient_checkpointing: True
max_norm: 5

weight_decay: 0.05
lr_scheduler_type: 'linearwarmupcosinelr'
init_lr: 0.0001 # 1e-4
min_lr: 0.00001 # 1e-5
lr_decay_rate: 0.9
warmup_lr: 0.00001 # 1e-5
warmup_steps: 100 # 1000
use_amp: True
max_opt_steps: 5000 # 5000000
max_epoch: 25 # 50

# Dataset parameters
target_col : 'OT'
scale : True
data_stride_len : 1 
# train_ratio : 0.6
# val_ratio : 0.1
# test_ratio : 0.3
train_ratio : 1.0
val_ratio : 0
test_ratio : 0


upsampling_pad_direction : "backward"
upsampling_type : "pad"
downsampling_type : "interpolate"
pad_mode : "constant"
pad_constant_values : 0
datasets_fraction : 1.00
train_batch_size : 512 #2048 # 1024 2048 3072 4096
val_batch_size: 512  # 3072 # 1024 2048 3072 4096 
shuffle : False
num_workers : 5
pin_memory : True
drop_last : False
